spring.application.name=backend

# Server Port
server.port=8080

# Spring Data Source (We use a file-based H2 database so data persists between app restarts)
spring.datasource.url=jdbc:h2:file:./data/ecommerce_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Enable the H2 Web Console (Must be 'true')
spring.h2.console.enabled=true

# Explicitly set the path to /h2-console
spring.h2.console.path=/h2-console

# JPA / Hibernate Configurations for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

